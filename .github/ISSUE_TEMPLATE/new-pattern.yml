name: Novo sinal
description: Um sinal de escrita de IA que nenhum padrão atual cobre.
labels: ["enhancement"]
body:
  - type: textarea
    id: before
    attributes:
      label: Exemplo
      description: Texto real que mostra o sinal. Remova informações privadas.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: Como uma pessoa escreveria
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Por que nenhum padrão atual cobre o caso
      description: Indique o padrão mais próximo e explique a diferença. A maioria dos sinais novos cabe em um padrão existente.
    validations:
      required: true
