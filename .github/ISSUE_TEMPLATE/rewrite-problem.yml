name: Problema na reescrita
description: A reescrita manteve um sinal, mudou o sentido, acrescentou um fato ou editou demais.
labels: ["bug"]
body:
  - type: dropdown
    id: problem
    attributes:
      label: O que deu errado
      options:
        - Um sinal sobreviveu à reescrita
        - A reescrita acrescentou ou removeu um fato
        - A reescrita alterou um trecho que estava adequado
        - Outro problema
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Texto de entrada
      description: O texto fornecido ao Humanizer. Remova informações privadas.
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: Como você usou a skill
      description: Informe agente, modelo e prompt exato.
      placeholder: "Claude Code, Opus: /humanizer-pt-br seguido do texto"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Resultado
      description: O que o Humanizer retornou.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que deveria ter feito
      description: Cite a frase problemática e como um autor cuidadoso a escreveria. Informe o número do padrão, se souber.
    validations:
      required: true
